# After Vercel finishes a production deploy, ping IndexNow (Bing, Yandex and
# others) with every URL in the sitemap so the new content is recrawled quickly.
name: IndexNow

on:
  deployment_status:

jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
